<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>House of Us — 3D</title>
<link rel="stylesheet" href="css/style.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<!-- CHERMO OWNERSHIP START -->
<meta name="copyright" content="Copyright © 2026 CHERMO. Original template material only.">
<script data-chermo-ownership="1">/* CHERMO ownership presentation. No tracking, network access or global copy restrictions. */
(function () {
  'use strict';
  const notice = {"brand":"CHERMO","holder":"CHERMO","year":2026,"version":1,"scope":"Original template designs, artwork, written content, animations, layouts and software created for CHERMO. Customer photographs, personal messages and separately identified third-party material are excluded.","terms":"Authorized customers may personalize, view and share their purchased memory experience. Copying, redistributing, reselling or reusing the original reusable template files or substantial parts of them for another product or service requires permission.","limits":"These measures discourage casual copying. Material displayed in a browser can still be captured or recreated. Third-party fonts, libraries and assets retain their respective rights and licenses."};
  function mount() {
    if (document.querySelector('chermo-ownership')) return;
    const host = document.createElement('chermo-ownership');
    host.style.cssText = 'display:block;position:relative;clear:both;flex:0 0 auto;max-width:100%;z-index:0';
    const root = host.attachShadow({ mode: 'open' });
    const style = document.createElement('style');
    style.textContent = 'details{box-sizing:border-box;margin:0;padding:12px 16px;text-align:center;font:12px/1.6 system-ui,sans-serif;color:inherit;background:transparent}summary{cursor:pointer;min-height:28px;align-content:center;list-style-position:inside;overflow-wrap:anywhere}summary:focus-visible{outline:2px solid currentColor;outline-offset:3px}p{max-width:70ch;margin:10px auto;text-align:left;overflow-wrap:anywhere}';
    const details = document.createElement('details');
    const summary = document.createElement('summary');
    summary.textContent = `Copyright © ${notice.year} ${notice.holder}. All rights reserved.`;
    details.append(summary);
    for (const text of [notice.scope, notice.terms, notice.limits]) {
      const p = document.createElement('p'); p.textContent = text; details.append(p);
    }
    root.append(style, details); document.body.append(host);
    // Scroll-locked cinematic scenes cannot reach a footer below the viewport.
    // Use a small corner disclosure there, avoiding existing interactive controls.
    const scrollLocked = [document.body, document.documentElement].some(el => ['hidden','clip'].includes(getComputedStyle(el).overflowY));
    if (scrollLocked) {
      const obstacles = [...document.querySelectorAll('button,a,input,textarea,select,[tabindex="0"]')].map(el => el.getBoundingClientRect()).filter(r => r.width && r.height);
      const positions = [{bottom:8,right:8},{bottom:8,left:8},{top:8,right:8},{top:8,left:8}];
      const position = positions.find(p => {
        const x=p.left??Math.max(0,innerWidth-168), y=p.top??Math.max(0,innerHeight-44);
        return !obstacles.some(r=>r.left<x+160&&r.right>x&&r.top<y+36&&r.bottom>y);
      }) || positions[0];
      host.style.position='fixed';host.style.zIndex='30';host.style.maxWidth='min(340px,calc(100vw - 16px))';
      for(const [key,value] of Object.entries(position))host.style[key]=`${value}px`;
      summary.textContent=`© ${notice.year} ${notice.brand} · Rights`;
      style.textContent+='details{padding:4px 9px;border:1px solid GrayText;border-radius:4px;max-height:65svh;overflow:auto;color:CanvasText;background:Canvas}summary{min-height:24px}';
      const p=document.createElement('p');p.textContent=`Copyright © ${notice.year} ${notice.holder}. All rights reserved.`;details.insertBefore(p,summary.nextSibling);
    }
    // Only explicitly marked, original presentation art is affected. Inputs,
    // customer photos, page gestures, copy commands and context menus are untouched.
    document.addEventListener('dragstart', event => {
      const target = event.target;
      if (!(target instanceof Element)) return;
      if (target.closest('input,textarea,[contenteditable="true"],a,button,[data-customer-content]')) return;
      if (target.closest('[data-chermo-artwork]')) event.preventDefault();
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', mount, { once: true });
  else mount();
})();
</script>
<!-- CHERMO OWNERSHIP END -->
</head>
<body>

<div id="stage">

  <div id="three-container"></div>
  <div class="key-chip" id="key-chip" aria-hidden="true"></div>
  <button class="daynight-toggle" id="daynight-toggle" aria-label="Toggle day and night">
    <span id="daynight-icon">&#9728;</span>
  </button>
  <label class="world-time" id="world-time-control" for="world-time">
    <span class="time-caption"><span id="time-of-day">AFTERNOON</span><span id="time-readout">2:00 PM</span></span>
    <input id="world-time" type="range" min="5" max="23" step="0.25" value="14" aria-label="Set the time of day">
  </label>

  <div id="loading">
    <div class="loading-inner">
      <div class="spinner"></div>
      <div>Building your world…</div>
    </div>
  </div>

  <!-- QUOTE TOAST -->
  <div id="quote-toast" aria-live="polite"></div>

  <!-- HINT -->
  <div id="hint">Scroll or pinch to zoom · Drag to orbit</div>

  <!-- HUD -->
  <div id="hud">
    <button class="hud-btn" data-hotspot="bookshelf">Books</button><button class="hud-btn" data-hotspot="tv">Television</button><button class="hud-btn" data-hotspot="garden">Garden</button><button class="hud-btn" id="zoom-toggle">Zoom in</button>
    <button class="hud-btn" id="end-visit">End this visit</button>
  </div>

  <!-- ARRIVAL OVERLAY -->
  <div class="overlay" id="arrival-overlay">
    <div class="names" id="arrival-names"></div>
    <p class="tagline">Welcome to your little world.</p>
    <button class="enter-btn" id="enter-btn">Explore our world</button>
  </div>

  <!-- ENDING OVERLAY -->
  <div class="overlay hidden" id="ending-overlay">
    <p class="ending-line d1">Home was never a place.</p>
    <p class="ending-line d2">It was always us.</p>
    <p class="names ending-line d3" id="ending-names"></p>
    <p class="ending-line d4" id="ending-message"></p>
  </div>

  <!-- BOOK MODAL -->
  <div class="modal-backdrop" id="book-modal">
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="Book">
      <button class="modal-close" id="book-close" aria-label="Close">&times;</button>
      <h3 class="book-title" id="book-title"></h3>
      <div class="book-sub" id="book-sub"></div>
      <div id="book-pages"></div>
      <div class="book-nav">
        <button id="book-prev">Prev</button>
        <div class="page-dots" id="book-dots"></div>
        <button id="book-next">Next</button>
      </div>
    </div>
  </div>

  <!-- TV MODAL -->
  <div class="modal-backdrop tv-modal" id="tv-modal">
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="Television">
      <button class="modal-close" id="tv-close" aria-label="Close">&times;</button>
      <div class="tv-screen" id="tv-screen">Select a video to play</div>
      <div class="video-list" id="video-list"></div>
    </div>
  </div>

  <!-- FLOWER MODAL -->
  <div class="modal-backdrop" id="flower-modal">
    <div class="modal-card" role="dialog" aria-modal="true" aria-label="Choose your flower">
      <button class="modal-close" id="flower-close" aria-label="Close">&times;</button>
      <h3 class="book-title">Your garden</h3>
      <div class="book-sub">Pick the flower that belongs to you two</div>
      <div class="flower-options" id="flower-options"></div>
    </div>
  </div>

</div>

<script src="js/data.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
